<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klantherkomst — Van Leeuwen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#13151f; --bg2:#191c29; --bg3:#20232f;
  --text:#e8eaf0; --sub:#8b8fa8; --sub2:#5c6079;
  --accent:#f68b2f;
  --accent2:#ffb357;
  --border:#2a2e3f;
  --up:#4caf7d; --down:#e0637a;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
.topbar{
  position:fixed; top:0; left:0; right:0; height:64px; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 32px; background:rgba(19,21,31,0.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar .brand{display:flex; align-items:center; gap:12px; font-weight:700; font-size:15px; letter-spacing:.02em;}
.topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.topbar .brand .excl-btw{color:var(--sub2); font-weight:500; font-size:11.5px; text-transform:none; letter-spacing:0;}
.dots{display:flex; gap:8px;}
.dots button{
  width:8px; height:8px; border-radius:50%; border:none; background:var(--border);
  cursor:pointer; transition:all .25s; padding:0;
}
.dots button.active{background:var(--accent); width:22px; border-radius:4px;}
.scope-toggle{
  display:flex; background:var(--bg3); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px;
  visibility:hidden; opacity:0; transition:opacity .2s;
}
.scope-toggle.visible{visibility:visible; opacity:1;}
.scope-toggle button{
  border:none; background:transparent; color:var(--sub); font-family:inherit; font-size:12.5px; font-weight:600;
  padding:7px 14px; border-radius:999px; cursor:pointer; transition:all .2s;
}
.scope-toggle button.active{background:var(--accent); color:#1a1305;}
.deck{position:relative; width:100vw; height:100vh;}
.slide{
  position:absolute; inset:0; padding:104px 64px 48px;
  opacity:0; pointer-events:none; transform:translateY(14px);
  transition:opacity .5s ease, transform .5s ease;
  display:flex; flex-direction:column;
  overflow-y:auto;
}
.slide.active{opacity:1; pointer-events:auto; transform:translateY(0);}
.slide-head{margin-bottom:28px;}
.eyebrow{color:var(--accent); font-size:12.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px;}
h1.slide-title{font-size:34px; font-weight:800; letter-spacing:-.01em;}
.slide-sub{color:var(--sub); font-size:14.5px; margin-top:6px; max-width:640px;}
.navhint{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:100;
  color:var(--sub2); font-size:12px; display:flex; gap:18px; align-items:center;
}
.navarrow{
  position:fixed; top:50%; transform:translateY(-50%); z-index:100; width:44px; height:44px; border-radius:50%;
  border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--sub); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:18px; transition:all .2s;
}
.navarrow:hover{background:var(--accent); color:#1a1305; border-color:var(--accent);}
#navPrev{left:18px;} #navNext{right:18px;}

/* ---- shared components ---- */
.grid{display:grid; gap:20px;}
.card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:22px;}
.kpi-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:6px;}
.kpi-card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:26px;}
.kpi-label{color:var(--sub); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;}
.kpi-value{font-size:40px; font-weight:800; margin-top:10px; letter-spacing:-.01em;}
.kpi-yoy{display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:700; margin-top:10px; padding:3px 9px; border-radius:999px;}
.kpi-yoy.up{color:var(--up); background:rgba(76,175,125,.12);}
.kpi-yoy.down{color:var(--down); background:rgba(224,99,122,.12);}
.kpi-foot{color:var(--sub2); font-size:12px; margin-top:8px;}

.funnel{display:flex; flex-direction:column; gap:12px; margin-top:10px;}
.funnel-row{display:grid; grid-template-columns:170px 1fr 100px 70px; align-items:center; gap:16px;}
.funnel-label{font-size:13.5px; font-weight:600; color:var(--sub);}
.funnel-bar-track{height:34px; background:var(--bg3); border-radius:8px; overflow:hidden; position:relative;}
.funnel-bar{height:100%; border-radius:8px; width:0; transition:width 1s cubic-bezier(.2,.8,.2,1);}
.funnel-amt{text-align:right; font-weight:700; font-size:14.5px;}
.funnel-pct{text-align:right; color:var(--sub); font-size:13px;}

.rank-list{display:flex; flex-direction:column; gap:0; margin-top:6px;}
.rank-row{display:grid; grid-template-columns:36px 1fr auto; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--border);}
.rank-row:last-child{border-bottom:none;}
.rank-num{font-size:20px; font-weight:800; color:var(--accent2);}
.rank-name{font-size:17px; font-weight:700;}
.rank-sub{color:var(--sub); font-size:12.5px; margin-top:2px;}
.rank-amt{font-size:19px; font-weight:800; text-align:right;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{
  text-align:left; color:var(--sub); font-weight:600; font-size:11.5px; text-transform:uppercase;
  letter-spacing:.05em; padding:0 12px 10px; border-bottom:1px solid var(--border);
}
thead th.num, td.num{text-align:right;}
tbody td{padding:12px 12px; border-bottom:1px solid var(--border);}
tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; margin-left:8px; text-transform:uppercase; letter-spacing:.03em;}
.badge.new{background:rgba(76,175,125,.15); color:var(--up);}
.badge.gone{background:rgba(224,99,122,.15); color:var(--down);}
.badge.rayon{background:rgba(139,143,168,.15); color:var(--sub);}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
.ring-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
.ring-val{font-size:30px; font-weight:800;}
.ring-label{color:var(--sub); font-size:13px;}

.zone-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:6px;}
.zone-card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
.zone-label{font-size:13px; font-weight:700; color:var(--sub);}
.zone-omzet{font-size:22px; font-weight:800; margin-top:8px;}
.zone-bar-track{height:6px; background:var(--bg3); border-radius:4px; margin-top:10px; overflow:hidden;}
.zone-bar{height:100%; width:0; border-radius:4px; transition:width 1s ease;}
.zone-meta{color:var(--sub2); font-size:11.5px; margin-top:8px; line-height:1.5;}

.bar-chart{display:flex; align-items:flex-end; gap:14px; height:260px; margin-top:20px; padding:0 4px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.bar-shape{width:100%; max-width:52px; border-radius:6px 6px 0 0; transition:height 1s cubic-bezier(.2,.8,.2,1); position:relative;}
.bar-val{font-size:11px; font-weight:700; margin-bottom:6px;}
.bar-name{font-size:11px; color:var(--sub); margin-top:8px; text-align:center;}

.kans-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:6px;}
.kans-card{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}
.kans-name{font-weight:700; font-size:15px;}
.kans-row{display:flex; justify-content:space-between; font-size:12.5px; color:var(--sub); margin-top:10px;}
.kans-row b{color:var(--text); font-weight:700;}
.kans-ma{display:inline-block; margin-top:10px; font-size:11px; font-weight:700; color:var(--down); background:rgba(224,99,122,.12); padding:3px 8px; border-radius:999px;}

#mapEl{flex:1; border-radius:var(--radius); overflow:hidden; min-height:400px; border:1px solid var(--border);}
.map-legend{position:absolute; bottom:26px; left:80px; background:rgba(25,28,41,.9); border:1px solid var(--border); border-radius:12px; padding:12px 16px; font-size:12px; color:var(--sub); z-index:400;}

.intro-slide{align-items:flex-start; justify-content:center; position:relative;}
.intro-circle{position:absolute; border-radius:50%; opacity:.08; background:var(--accent);}
.intro-title{font-size:64px; font-weight:800; letter-spacing:-.02em; line-height:1.05;}
.intro-sub{color:var(--sub); font-size:17px; margin-top:16px;}
.intro-logo{width:64px; height:64px; object-fit:contain; border-radius:14px; image-rendering:-webkit-optimize-contrast; box-shadow:0 6px 20px rgba(0,0,0,.35);}
.intro-logo-row{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
.intro-meta{margin-top:36px; display:flex; gap:28px;}
.intro-meta div{font-size:12.5px; color:var(--sub2); text-transform:uppercase; letter-spacing:.08em;}
.intro-meta b{display:block; color:var(--text); font-size:15px; font-weight:700; text-transform:none; letter-spacing:0; margin-top:4px;}

.map-legend-item{display:flex; align-items:center; gap:8px; margin-top:4px;}
.map-legend-dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
.map-toggle{position:absolute; top:14px; right:14px; z-index:400; display:flex; background:rgba(25,28,41,.92); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px;}
.map-toggle button{border:none; background:transparent; color:var(--sub); font-family:inherit; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer;}
.map-toggle button.active{background:var(--accent); color:#1a1305;}
.note{color:var(--sub2); font-size:11.5px; margin-top:14px; line-height:1.6;}
.pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; background:var(--bg3); color:var(--sub);}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('report-data').textContent);
const LOGO_B64 = document.getElementById('logo-data').textContent.trim();
let state = { slide: 0, scope: 'particulier' };

// ---------- helpers ----------
function euroK(n){
  if(n===null || n===undefined) return '—';
  return '€ ' + Number(n).toLocaleString('nl-NL', {maximumFractionDigits:0});
}
function pct(n, decimals=1){
  if(n===null || n===undefined) return '—';
  return Number(n).toLocaleString('nl-NL', {minimumFractionDigits:decimals, maximumFractionDigits:decimals}) + '%';
}
function num(n){
  if(n===null || n===undefined) return '—';
  return Number(n).toLocaleString('nl-NL');
}
function animateCount(elx, target, type, duration=900){
  const t0 = performance.now();
  function step(t){
    const p = Math.min(1, (t-t0)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = target*eased;
    elx.textContent = type==='euro' ? euroK(Math.round(val)) : type==='pct' ? pct(val,1) : num(Math.round(val));
    if(p<1) requestAnimationFrame(step);
    else elx.textContent = type==='euro' ? euroK(target) : type==='pct' ? pct(target,1) : num(target);
  }
  requestAnimationFrame(step);
}

const ACCENT = DATA.meta.kleur;
const ACCENT_ZAKELIJK = DATA.meta.kleur_zakelijk;
function shade(hex, amt){
  const c = hex.replace('#','');
  const n = parseInt(c,16);
  let r=(n>>16)+amt, g=((n>>8)&0xff)+amt, b=(n&0xff)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function scopeColor(){ return state.scope==='particulier' ? ACCENT : ACCENT_ZAKELIJK; }
function scopeLabel(){ return state.scope==='particulier' ? 'particuliere klanten' : 'zakelijke klanten'; }

// ---------- slide definitions ----------
const SLIDES = [
  {id:'intro', title:'Intro', render: renderIntro, toggle:false},
  {id:'kerncijfers', title:'Kerncijfers', render: renderKerncijfers, toggle:false},
  {id:'omzetopbouw', title:'Omzetopbouw', render: renderOmzetopbouw, toggle:false},
  {id:'top5', title:'Top 5 postcodegebieden', render: renderTop5, toggle:true},
  {id:'afstand', title:'Hoe ver rijdt de klant?', render: renderAfstand, toggle:true},
  {id:'rayon', title:'Verzorgingsgebied', render: renderRayon, toggle:true},
  {id:'klantherkomst', title:'Klantherkomst 2025', render: renderKlantherkomst, toggle:true},
  {id:'marktaandeel', title:'Marktaandeel', render: renderMarktaandeel, toggle:false},
  {id:'kansen', title:'Kansen', render: renderKansen, toggle:false},
  {id:'kaart', title:'Kaart', render: renderKaart, toggle:false},
];

const deck = document.getElementById('deck');
SLIDES.forEach((s,i)=>{
  const section = document.createElement('section');
  section.className = 'slide';
  section.id = 'slide-'+i;
  deck.appendChild(section);
});
const dotsWrap = document.getElementById('dots');
SLIDES.forEach((s,i)=>{
  const b = document.createElement('button');
  b.addEventListener('click', ()=>goTo(i));
  dotsWrap.appendChild(b);
});

function goTo(i){
  i = Math.max(0, Math.min(SLIDES.length-1, i));
  state.slide = i;
  document.querySelectorAll('.slide').forEach((el,idx)=> el.classList.toggle('active', idx===i));
  document.querySelectorAll('#dots button').forEach((el,idx)=> el.classList.toggle('active', idx===i));
  const s = SLIDES[i];
  document.getElementById('scopeToggle').classList.toggle('visible', s.toggle);
  const section = document.getElementById('slide-'+i);
  section.innerHTML = s.render();
  triggerAnimations(section);
  if(s.id==='kaart') setTimeout(initMap, 60);
}
document.getElementById('navPrev').addEventListener('click', ()=>goTo(state.slide-1));
document.getElementById('navNext').addEventListener('click', ()=>goTo(state.slide+1));
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goTo(state.slide+1);
  if(e.key==='ArrowLeft') goTo(state.slide-1);
});
document.querySelectorAll('#scopeToggle button').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.scope = b.dataset.scope;
    document.querySelectorAll('#scopeToggle button').forEach(x=>x.classList.toggle('active', x===b));
    const section = document.getElementById('slide-'+state.slide);
    section.innerHTML = SLIDES[state.slide].render();
    triggerAnimations(section);
  });
});

function triggerAnimations(section){
  section.querySelectorAll('[data-countup]').forEach(elx=>{
    animateCount(elx, parseFloat(elx.dataset.countup), elx.dataset.type);
  });
  requestAnimationFrame(()=>{
    section.querySelectorAll('[data-barwidth]').forEach(b=>{ b.style.width = b.dataset.barwidth; });
    section.querySelectorAll('[data-barheight]').forEach(b=>{ b.style.height = b.dataset.barheight; });
    section.querySelectorAll('.ring-anim').forEach(r=>{
      r.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)';
      r.style.strokeDashoffset = r.dataset.ringoffset;
    });
  });
}

// ============================================================
// SLIDE 1 — INTRO
// ============================================================
function renderIntro(){
  return `
  <div class="intro-slide" style="height:100%;">
    <div class="intro-circle" style="width:900px;height:900px;top:-380px;right:-320px;"></div>
    <div class="intro-circle" style="width:500px;height:500px;bottom:-260px;left:-180px;"></div>
    <div style="max-width:760px; z-index:2;">
      <div class="intro-logo-row">
        <img class="intro-logo" src="data:image/jpeg;base64,${LOGO_B64}" alt="Ambiance Van Leeuwen logo">
      </div>
      <div class="eyebrow">Klantherkomstanalyse</div>
      <div class="intro-title">${DATA.meta.vestiging}</div>
      <div class="intro-sub">${DATA.meta.plaats} &nbsp;·&nbsp; ${DATA.meta.periode[0]}</div>
      <div class="intro-meta">
        <div>Vestigingsadres <b>${DATA.meta.adres}</b></div>
        <div>Rayon <b>${DATA.meta.rayon_pc4.length} postcodegebieden</b></div>
      </div>
    </div>
  </div>`;
}

// ============================================================
// SLIDE 2 — KERNCIJFERS
// ============================================================
function renderKerncijfers(){
  const k = DATA.kpi['2025'];
  return `
  <div class="slide-head"><div class="eyebrow">Slide 2</div><h1 class="slide-title">Kerncijfers 2025</h1>
  <div class="slide-sub">Totale factuurwaarde, offerte-akkoordpercentage en online aanvragen.</div></div>
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Totale factuurwaarde</div>
      <div class="kpi-value" data-countup="${k.factuurwaarde}" data-type="euro">€ 0</div>
      <div class="kpi-foot">Particulier + zakelijk, incl. btw</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Akkoordpercentage offertes</div>
      <div class="kpi-value" data-countup="${k.akkoordpercentage}" data-type="pct">0%</div>
      <div class="kpi-foot">Obv offerte-status (geen offertebedragen beschikbaar)</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Online aanvragen</div>
      <div class="kpi-value" data-countup="${k.online_aanvragen}" data-type="num">0</div>
      <div class="kpi-foot">${Object.entries(k.online_aanvragen_breakdown||{}).map(([t,n])=>`${t} ${n}`).join(' · ')}</div>
    </div>
  </div>
  <div class="note">Het akkoordpercentage komt uit de Winning Proposal-export (aantal offertes, geen bedragen). Deze bron week eerder al af van het HubSpot-dashboard qua telmethode — gebruik als indicatie, niet als exacte conversieratio.</div>
  `;
}

// ============================================================
// SLIDE 3 — OMZETOPBOUW
// ============================================================
function renderOmzetopbouw(){
  const o = DATA.omzetopbouw;
  const ia = o.inkoop_allround;
  const rows = [
    {label:'Factuurwaarde', val:o.factuur, pct:100, color:ACCENT},
    {label:'B2C (particulier)', val:o.b2c, pct:o.b2c_pct, color:shade(ACCENT,10)},
    {label:'B2B (zakelijk)', val:o.b2b, pct:o.b2b_pct, color:ACCENT_ZAKELIJK},
    {label:'Waarvan reparatie', val:o.reparatie, pct:o.reparatie_pct, color:shade(ACCENT,-50)},
  ];
  const maxVal = o.factuur;
  return `
  <div class="slide-head"><div class="eyebrow">Slide 3</div><h1 class="slide-title">Omzetopbouw 2025</h1>
  <div class="slide-sub">Van totale factuurwaarde naar B2C/B2B-verdeling en reparatie-aandeel. Alle bedragen incl. btw.</div></div>
  <div class="funnel">
    ${rows.map(r=>`
      <div class="funnel-row">
        <div class="funnel-label">${r.label}</div>
        <div class="funnel-bar-track"><div class="funnel-bar" style="background:${r.color};" data-barwidth="${(r.val/maxVal*100).toFixed(1)}%"></div></div>
        <div class="funnel-amt">${euroK(r.val)}</div>
        <div class="funnel-pct">${pct(r.pct)}</div>
      </div>
    `).join('')}
  </div>
  <div class="card" style="margin-top:26px; max-width:520px;">
    <div class="kpi-label">Inkoop Allround-leveranciers (${ia.jaar}) &nbsp;<span class="pill">staffel ${ia.staffel}</span></div>
    <div style="display:flex; gap:32px; margin-top:14px;">
      <div><div class="rank-sub">Omzet</div><div style="font-size:20px;font-weight:800;">${euroK(ia.omzet)}</div></div>
      <div><div class="rank-sub">Afdracht</div><div style="font-size:20px;font-weight:800;">${euroK(ia.afdracht)}</div></div>
    </div>
    <div class="note">${ia.staffel_uitleg}. Marge-referentie, niet opgeteld in de trechter hierboven — betreft een deel van de omzet dat onder de Allround-samenwerking valt.</div>
  </div>
  `;
}

// ============================================================
// SLIDE 4 — TOP 5 PC4
// ============================================================
function renderTop5(){
  const top5 = DATA.top5[state.scope];
  const max = top5[0]?.omzet || 1;
  return `
  <div class="slide-head"><div class="eyebrow">Slide 4</div><h1 class="slide-title">Top 5 postcodegebieden</h1>
  <div class="slide-sub">Omzet 2025 &nbsp;·&nbsp; ${scopeLabel()}</div></div>
  <div class="rank-list">
    ${top5.map((r,i)=>`
      <div class="rank-row">
        <div class="rank-num">${String(i+1).padStart(2,'0')}</div>
        <div>
          <div class="rank-name">${r.naam} <span style="color:var(--sub); font-weight:500; font-size:13px;">— ${r.pc4}</span></div>
          <div class="rank-sub" style="width:100%;"><div class="zone-bar-track" style="width:280px;"><div class="zone-bar" style="background:${scopeColor()};" data-barwidth="${(r.omzet/max*100).toFixed(1)}%"></div></div></div>
        </div>
        <div class="rank-amt">${euroK(r.omzet)}</div>
      </div>
    `).join('')}
  </div>`;
}

// ============================================================
// SLIDE 5 — AFSTANDZONES
// ============================================================
function renderAfstand(){
  const z = DATA.afstandzones[state.scope];
  const labels = Object.keys(z);
  const maxOmzet = Math.max(...labels.map(l=>z[l].omzet));
  const isPart = state.scope==='particulier';
  return `
  <div class="slide-head"><div class="eyebrow">Slide 5</div><h1 class="slide-title">Hoe ver rijdt de klant?</h1>
  <div class="slide-sub">Omzet per reistijdzone vanaf ${DATA.meta.adres} — 2025 &nbsp;·&nbsp; ${scopeLabel()}</div></div>
  <div class="zone-grid">
    ${labels.map(l=>{
      const zz = z[l];
      return `
      <div class="zone-card">
        <div class="zone-label">${l}</div>
        <div class="zone-omzet">${euroK(zz.omzet)}</div>
        <div class="zone-bar-track"><div class="zone-bar" style="background:${scopeColor()};" data-barwidth="${(zz.omzet/maxOmzet*100).toFixed(1)}%"></div></div>
        <div class="zone-meta">
          ${pct(zz.pct_van_totaal)} van totaal &nbsp;·&nbsp; ${num(zz.klanten)} klanten
          ${isPart ? `<br>Kooppotentieel: ${euroK(zz.kooppotentieel)}<br>Marktaandeel: ${zz.marktaandeel!==null ? pct(zz.marktaandeel,2) : '—'}` : ''}
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="note">Reistijd = referentiewaarde uit Reijstijd_postcodes.xlsx (Van Leeuwen) waar bekend, anders geschat als max(5, 5 + afstand_km × 1.5).${isPart ? ' Kooppotentieel = CBS totale consumptieve besteding per PC4 (2025); niet voor alle verre postcodes beschikbaar.' : ''}</div>
  `;
}

// ============================================================
// SLIDE 6 — RAYON (verzorgingsgebied)
// ============================================================
function renderRayon(){
  const r = DATA.rayon_aandeel[state.scope];
  const circ = 2*Math.PI*54;
  const offset = circ * (1 - r.binnen_pct/100);
  return `
  <div class="slide-head"><div class="eyebrow">Slide 6</div><h1 class="slide-title">Verzorgingsgebied</h1>
  <div class="slide-sub">Omzetaandeel binnen het officiële rayon (${DATA.meta.rayon_pc4.length} postcodegebieden), 2025 — ${scopeLabel()}</div></div>
  <div class="two-col">
    <div class="card" style="display:flex; justify-content:center; align-items:center; padding:36px;">
      <div class="ring-wrap">
        <svg width="180" height="180" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="54" fill="none" stroke="var(--bg3)" stroke-width="14"/>
          <circle class="ring-anim" cx="75" cy="75" r="54" fill="none" stroke="${scopeColor()}" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
            data-ringoffset="${offset}" transform="rotate(-90 75 75)"/>
        </svg>
        <div class="ring-val">${pct(r.binnen_pct)}</div>
        <div class="ring-label">binnen rayon</div>
      </div>
    </div>
    <div class="card">
      <div class="kpi-label">Binnen vs. buiten rayon</div>
      <div class="funnel" style="margin-top:16px;">
        <div class="funnel-row" style="grid-template-columns:70px 1fr 120px;">
          <div class="funnel-label">Binnen</div>
          <div class="funnel-bar-track"><div class="funnel-bar" style="background:${scopeColor()};" data-barwidth="${r.binnen_pct}%"></div></div>
          <div class="funnel-amt">${euroK(r.binnen_omzet)}</div>
        </div>
        <div class="funnel-row" style="grid-template-columns:70px 1fr 120px;">
          <div class="funnel-label">Buiten</div>
          <div class="funnel-bar-track"><div class="funnel-bar" style="background:var(--sub2);" data-barwidth="${r.buiten_pct}%"></div></div>
          <div class="funnel-amt">${euroK(r.buiten_omzet)}</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ============================================================
// SLIDE 7 — KLANTHERKOMST TABEL 2025
// ============================================================
function renderKlantherkomst(){
  const rows = DATA.klantherkomst_tabel[state.scope];
  const isPart = state.scope==='particulier';
  return `
  <div class="slide-head"><div class="eyebrow">Slide 7</div><h1 class="slide-title">Klantherkomst 2025</h1>
  <div class="slide-sub">Top 15 postcodegebieden op omzet — ${scopeLabel()}</div></div>
  <div class="card">
  <table>
    <thead><tr>
      <th>PC4</th><th>Naam</th><th>Gemeente</th><th class="num">Reistijd</th><th class="num">Klanten</th>
      <th class="num">Omzet</th>${isPart ? '<th class="num">Kooppotentieel</th><th class="num">Marktaandeel</th>' : ''}
    </tr></thead>
    <tbody>
      ${rows.map(r=>{
        let badge = r.nieuw_in_2025 ? '<span class="badge new">Nieuw in 2025</span>' : '';
        return `<tr>
          <td>${r.pc4}</td>
          <td>${r.naam}${badge}${r.in_rayon?'':' <span class="badge rayon">buiten rayon</span>'}</td>
          <td>${r.gemeente}</td>
          <td class="num">${r.reistijd!==null?r.reistijd+' min':'—'}</td>
          <td class="num">${num(r.klanten)}</td>
          <td class="num">${euroK(r.omzet)}</td>
          ${isPart ? `<td class="num">${r.kooppotentieel?euroK(r.kooppotentieel):'—'}</td><td class="num">${r.marktaandeel!==null?pct(r.marktaandeel,2):'—'}</td>` : ''}
        </tr>`;
      }).join('')}
    </tbody>
  </table>
  </div>
  <div class="note">"Nieuw in 2025" = postcodegebied had in 2024 geen omzet in deze categorie (${scopeLabel()}).</div>
  `;
}

// ============================================================
// SLIDE 8 — MARKTAANDEEL (altijd particulier)
// ============================================================
function renderMarktaandeel(){
  const rows = DATA.marktaandeel_kern.filter(r=>r.marktaandeel!==null);
  const max = Math.max(...rows.map(r=>r.marktaandeel), 1);
  return `
  <div class="slide-head"><div class="eyebrow">Slide 8</div><h1 class="slide-title">Marktaandeel per kerngebied</h1>
  <div class="slide-sub">Omzet 2025 als aandeel van het CBS-kooppotentieel, top-10 postcodegebieden — particuliere klanten</div></div>
  <div class="card">
    <div style="color:var(--sub); font-size:13.5px; max-width:640px; line-height:1.6;">
      Het marktaandeel laat zien welk deel van de totale consumptieve besteding aan interieur/zonwering in een postcodegebied
      bij Van Leeuwen terechtkomt. Gebaseerd op CBS-huishoudbesteding, daarom alleen zinvol voor particuliere omzet.
    </div>
    <div class="bar-chart">
      ${rows.map(r=>`
        <div class="bar-col">
          <div class="bar-val">${pct(r.marktaandeel,1)}</div>
          <div class="bar-shape" style="background:${ACCENT};" data-barheight="${(r.marktaandeel/max*100).toFixed(1)}%"></div>
          <div class="bar-name">${r.pc4}<br>${euroK(r.omzet)}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

// ============================================================
// SLIDE 9 — KANSEN (altijd particulier)
// ============================================================
function renderKansen(){
  const rows = DATA.kansen;
  return `
  <div class="slide-head"><div class="eyebrow">Slide 9</div><h1 class="slide-title">Kansgebieden</h1>
  <div class="slide-sub">Rayongebieden met hoog kooppotentieel maar marktaandeel &lt; 10% (2025) — particuliere klanten</div></div>
  <div class="kans-grid">
    ${rows.map(r=>`
      <div class="kans-card">
        <div class="kans-name">${r.naam}</div>
        <div class="rank-sub">${r.pc4}</div>
        <div class="kans-ma">${pct(r.marktaandeel,2)} marktaandeel</div>
        <div class="kans-row"><span>Kooppotentieel</span><b>${euroK(r.kooppotentieel)}</b></div>
        <div class="kans-row"><span>Afstand</span><b>${r.afstand_km!==null?r.afstand_km+' km':'—'}</b></div>
        <div class="kans-row"><span>Reistijd</span><b>${r.reistijd!==null?r.reistijd+' min':'—'}</b></div>
      </div>`).join('')}
  </div>`;
}

// ============================================================
// SLIDE 10 — KAART (particulier + zakelijk samen, cirkels)
// ============================================================
function renderKaart(){
  return `
  <div class="slide-head"><div class="eyebrow">Slide 10</div><h1 class="slide-title">Klantherkomst op de kaart</h1>
  <div class="slide-sub">Omzet 2025 per postcodegebied — particulier en zakelijk samen, apart gekleurd</div></div>
  <div style="position:relative; flex:1; display:flex;">
    <div id="mapEl"></div>
    <div class="map-legend">
      <div class="map-legend-item"><span class="map-legend-dot" style="background:${ACCENT};"></span> Particulier</div>
      <div class="map-legend-item"><span class="map-legend-dot" style="background:${ACCENT_ZAKELIJK};"></span> Zakelijk</div>
    </div>
  </div>
  `;
}

let leafletMap = null;
function initMap(){
  const points = DATA.kaart;
  if(!points || !points.length) return;
  const mapDiv = document.getElementById('mapEl');
  if(!mapDiv) return;
  if(leafletMap){ leafletMap.remove(); leafletMap = null; }
  leafletMap = L.map('mapEl', {scrollWheelZoom:true}).setView(DATA.meta.coords, 10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
  }).addTo(leafletMap);
  const maxOmzet = Math.max(...points.map(p=>p.omzet));
  [...points].sort((a,b)=> a.type==='zakelijk'?-1:1).forEach(p=>{
    const r = 4 + Math.sqrt(p.omzet/maxOmzet)*26;
    const color = p.type==='zakelijk' ? ACCENT_ZAKELIJK : ACCENT;
    L.circleMarker([p.lat,p.lon], {
      radius:r, color:color, weight:1, fillColor:color, fillOpacity:0.45
    }).addTo(leafletMap).bindPopup(`<b>${p.naam}</b> (${p.pc4}) — ${p.type==='zakelijk'?'zakelijk':'particulier'}<br>Omzet: ${euroK(p.omzet)}<br>Klanten: ${p.klanten}`);
  });
  L.marker(DATA.meta.coords).addTo(leafletMap).bindPopup(`<b>${DATA.meta.vestiging}</b><br>${DATA.meta.adres}`);
}

window.SLIDES = SLIDES;
window.state = state;
window.goTo = goTo;
window.DATA = DATA;

goTo(0);

</script>
